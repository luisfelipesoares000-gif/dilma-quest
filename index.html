// --- 1. GERENCIADOR DE ÁUDIO SINTÉTICO (Web Audio API) ---
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.musicEnabled = true;
    this.sfxEnabled = true;
    this.currentTrack = null;
    this.tempo = 120;
    this.step = 0;
    this.timer = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playTone(freq, type, duration, vol = 0.1) {
    if (!this.sfxEnabled) return;
    this.init();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  sfxJump() {
    if (!this.sfxEnabled) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.14);
    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.15);
  }

  sfxCoin() {
    if (!this.sfxEnabled) return;
    this.init();
    this.playTone(987.77, 'sine', 0.08, 0.12);
    setTimeout(() => this.playTone(1318.51, 'sine', 0.2, 0.12), 70);
  }

  sfxHeart() {
    if (!this.sfxEnabled) return;
    this.init();
    [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
      setTimeout(() => this.playTone(f, 'triangle', 0.18, 0.15), idx * 70);
    });
  }

  sfxHit() {
    if (!this.sfxEnabled) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.22);
  }

  sfxAttack() {
    if (!this.sfxEnabled) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.11);
  }

  sfxCorrect() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.15, 0.12), i * 90);
    });
  }

  sfxWrong() {
    [260, 220, 190].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sawtooth', 0.18, 0.1), i * 110);
    });
  }

  startMusic(track) {
    if (this.currentTrack === track && this.timer) return;
    this.stopMusic();
    this.currentTrack = track;
    if (!this.musicEnabled) return;
    this.init();

    const melodies = {
      menu: [261.6, 293.7, 329.6, 392.0, 329.6, 392.0, 523.3, 392.0],
      world: [329.6, 392.0, 440.0, 523.3, 440.0, 392.0, 329.6, 293.7],
      level1: [261.6, 329.6, 392.0, 440.0, 392.0, 329.6, 261.6, 196.0],
      level2: [220.0, 261.6, 293.7, 349.2, 329.6, 293.7, 261.6, 220.0],
      level3: [196.0, 246.9, 293.7, 329.6, 293.7, 246.9, 196.0, 164.8],
      level4: [174.6, 220.0, 261.6, 220.0, 174.6, 164.8, 146.8, 164.8],
      boss: [146.8, 146.8, 220.0, 174.6, 146.8, 130.8, 146.8, 196.0],
      victory: [261.6, 329.6, 392.0, 523.3, 659.3, 783.9, 1046.5, 1046.5]
    };

    const notes = melodies[track] || melodies.level1;
    let step = 0;
    const interval = track === 'boss' ? 180 : 250;

    this.timer = setInterval(() => {
      if (!this.musicEnabled) return;
      const f = notes[step % notes.length];
      this.playTone(f, track === 'boss' ? 'sawtooth' : 'triangle', 0.22, 0.04);
      step++;
    }, interval);
  }

  stopMusic() {
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
    this.currentTrack = null;
  }
}

// --- 4. PERSISTÊNCIA (Armazenamento Local) ---
class StorageSystem {
  static KEY = "DILMA_QUEST_SAVE_V1";

  static getInitial() {
    return {
      unlockedLevel: 1,
      completedLevels: [],
      score: 0,
      coins: 0,
      heartsCollected: 0,
      soundVolume: 1,
      musicVolume: 1
    };
  }

  static load() {
    try {
      const data = localStorage.getItem(this.KEY);
      if (data) return JSON.parse(data);
    } catch (e) {}
    return this.getInitial();
  }

  static save(state) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(state));
    } catch (e) {}
  }

  static reset() {
    try {
      localStorage.removeItem(this.KEY);
    } catch (e) {}
  }
}

// --- 6. ARTISTA PROCEDURAL EM PIXEL ART ---
class PixelArtist {
  static drawDilma(ctx, x, y, facing, animFrame, state = 'idle') {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (facing < 0) {
      ctx.scale(-1, 1);
    }

    const bob = (state === 'walk' || state === 'run') ? Math.sin(animFrame * 0.3) * 3 : Math.sin(animFrame * 0.1) * 1.5;

    // Sombra suave no chão
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(0, 36, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pernas / Saia
    ctx.fillStyle = "#283593"; // Saia estilosa azul escuro
    ctx.fillRect(-10, 16 + bob, 20, 14);

    // Sapatos confortáveis de professora
    ctx.fillStyle = "#212121";
    const legOffset = (state === 'walk') ? Math.sin(animFrame * 0.3) * 6 : 0;
    ctx.fillRect(-9 + legOffset, 30 + bob, 8, 6);
    ctx.fillRect(1 - legOffset, 30 + bob, 8, 6);

    // Blusa / Cardigã acolhedor de professora (verde água suave)
    ctx.fillStyle = "#26a69a";
    ctx.fillRect(-12, -2 + bob, 24, 20);

    // Lenço elegante / Gola
    ctx.fillStyle = "#ffca28";
    ctx.fillRect(-5, -2 + bob, 10, 6);

    // Braço & Mãozinha segurando o Caderno do Saber
    ctx.fillStyle = "#ffcc80";
    ctx.fillRect(-14, 4 + bob, 5, 8);
    // Livro/Caderno de Anotações
    ctx.fillStyle = "#d32f2f";
    ctx.fillRect(8, 2 + bob, 7, 10);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(9, 3 + bob, 5, 8);

    // Cabeça / Rosto amigável e gentil da Professora Dilma
    ctx.fillStyle = "#ffcc80";
    ctx.fillRect(-11, -22 + bob, 22, 20);

    // Cabelo castanho charmoso e volumoso
    ctx.fillStyle = "#5d4037";
    ctx.fillRect(-13, -26 + bob, 26, 8);
    ctx.fillRect(-14, -22 + bob, 5, 16);
    ctx.fillRect(9, -22 + bob, 5, 12);

    // Óculos marcantes de professora sábia (Armação delicada)
    ctx.strokeStyle = "#b71c1c";
    ctx.lineWidth = 2;
    ctx.strokeRect(-8, -16 + bob, 6, 6);
    ctx.strokeRect(2, -16 + bob, 6, 6);
    ctx.beginPath();
    ctx.moveTo(-2, -13 + bob);
    ctx.lineTo(2, -13 + bob);
    ctx.stroke();

    // Olhos simpáticos
    ctx.fillStyle = "#3e2723";
    ctx.fillRect(-6, -14 + bob, 2, 2);
    ctx.fillRect(4, -14 + bob, 2, 2);

    // Sorriso acolhedor
    ctx.fillStyle = "#d81b60";
    ctx.fillRect(-3, -7 + bob, 6, 2);

    ctx.restore();
  }

  static drawEnemy(ctx, x, y, type, frame) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    if (type === 'slime') {
      // Slime da Floresta
      const bounce = Math.abs(Math.sin(frame * 0.2)) * 4;
      ctx.fillStyle = "#66bb6a";
      ctx.beginPath();
      ctx.ellipse(0, 10 - bounce/2, 14 + bounce/2, 12 - bounce/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-6, 4 - bounce/2, 4, 4);
      ctx.fillRect(2, 4 - bounce/2, 4, 4);
      ctx.fillStyle = "#000";
      ctx.fillRect(-4, 6 - bounce/2, 2, 2);
      ctx.fillRect(4, 6 - bounce/2, 2, 2);
    } else if (type === 'cactus') {
      // Monstrinho Cacto do Deserto
      ctx.fillStyle = "#2e7d32";
      ctx.fillRect(-10, -10, 20, 28);
      ctx.fillRect(-16, -2, 6, 8);
      ctx.fillRect(10, -6, 6, 8);
      ctx.fillStyle = "#ffeb3b";
      ctx.fillRect(-5, -4, 3, 3);
      ctx.fillRect(2, -4, 3, 3);
    } else if (type === 'golem') {
      // Golem de Gelo das Montanhas
      ctx.fillStyle = "#81d4fa";
      ctx.fillRect(-14, -14, 28, 28);
      ctx.fillStyle = "#0288d1";
      ctx.fillRect(-10, -10, 20, 20);
      ctx.fillStyle = "#fff";
      ctx.fillRect(-6, -6, 4, 4);
      ctx.fillRect(2, -6, 4, 4);
    } else {
      // Guarda das Sombras do Castelo
      ctx.fillStyle = "#311b92";
      ctx.fillRect(-12, -16, 24, 30);
      ctx.fillStyle = "#d50000";
      ctx.fillRect(-6, -8, 4, 4);
      ctx.fillRect(2, -8, 4, 4);
    }
    ctx.restore();
  }

  static drawBoss(ctx, x, y, hp, maxHp, frame, state) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    const breathe = Math.sin(frame * 0.1) * 8;
    const shake = state === 'hit' ? (Math.random() * 8 - 4) : 0;

    // Aura sombria pulsante
    const grad = ctx.createRadialGradient(shake, breathe, 20, shake, breathe, 110);
    grad.addColorStop(0, "rgba(106, 27, 154, 0.7)");
    grad.addColorStop(0.7, "rgba(49, 27, 146, 0.4)");
    grad.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(shake, breathe, 110, 0, Math.PI * 2);
    ctx.fill();

    // Corpo do Devorador das Sombras (Engraçado e imponente)
    ctx.fillStyle = "#1a0033";
    ctx.beginPath();
    ctx.ellipse(shake, breathe, 65, 75, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tentáculos sombrios se movendo suavemente
    ctx.strokeStyle = "#4a148c";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    for (let i = 0; i < 6; i++) {
      const angle = (i * Math.PI / 3) + Math.sin(frame * 0.05 + i) * 0.3;
      const tx = Math.cos(angle) * (80 + Math.sin(frame * 0.1 + i) * 15);
      const ty = Math.sin(angle) * (80 + Math.cos(frame * 0.1 + i) * 15) + breathe;
      ctx.beginPath();
      ctx.moveTo(shake, breathe);
      ctx.quadraticCurveTo(shake + tx * 0.5, breathe + ty * 0.5, shake + tx, ty);
      ctx.stroke();
    }

    // Olhos gigantes e brilhantes (Feio de propósito, caricato)
    ctx.fillStyle = "#ffd600";
    ctx.beginPath();
    ctx.arc(shake - 26, breathe - 15, 16, 0, Math.PI * 2);
    ctx.arc(shake + 26, breathe - 15, 20, 0, Math.PI * 2);
    ctx.arc(shake, breathe - 35, 12, 0, Math.PI * 2); // Terceiro olho cômico
    ctx.fill();

    // Pupilas
    ctx.fillStyle = "#d50000";
    ctx.fillRect(shake - 28, breathe - 17, 6, 6);
    ctx.fillRect(shake + 26, breathe - 17, 8, 8);
    ctx.fillRect(shake - 2, breathe - 37, 5, 5);

    // Boca com dentes engraçados e desajeitados
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(shake, breathe + 25, 30, 0, Math.PI);
    ctx.fill();

    ctx.fillStyle = "#fff";
    for (let d = -20; d <= 20; d += 10) {
      ctx.fillRect(shake + d, breathe + 25, 6, 7);
    }

    ctx.restore();
  }

  static drawHeart(ctx, x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#ff1744";
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-10, -10, -18, 5, 0, 18);
    ctx.bezierCurveTo(18, 5, 10, -10, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  static drawCoin(ctx, x, y, frame) {
    ctx.save();
    ctx.translate(x, y);
    const spin = Math.cos(frame * 0.15);
    ctx.scale(spin, 1);
    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ff6f00";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#ffeb3b";
    ctx.fillRect(-2, -6, 4, 12);
    ctx.restore();
  }
}

// --- 7. SISTEMA DE GERENCIAMENTO DE ESTADOS DO JOGO ---
class Game {
  constructor() {
    this.canvas = document.getElementById("gameCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.state = "TITLE"; // TITLE, WORLD_MAP, LEVEL, BOSS, VICTORY, GAMEOVER
    this.saveData = StorageSystem.load();

    this.currentWorldIdx = 0;
    this.currentLevelIdx = 0;
    this.currentLevelData = null;

    this.keys = {};
    this.mouse = { x: 0, y: 0, clicked: false };

    // Player State
    this.player = {
      x: 100,
      y: 350,
      vx: 0,
      vy: 0,
      w: 30,
      h: 46,
      facing: 1,
      grounded: false,
      coyoteTimer: 0,
      lives: 3,
      invulnerable: 0,
      animFrame: 0,
      state: 'idle'
    };

    this.projectiles = [];
    this.enemies = [];
    this.coins = [];
    this.hearts = [];
    this.quizTriggers = [];
    this.particles = [];
    this.cameraX = 0;

    // Boss Data
    this.boss = {
      active: false,
      x: 2300,
      y: 280,
      hp: 12,
      maxHp: 12,
      timer: 0,
      state: 'idle',
      hitTimer: 0
    };

    this.isPaused = false;
    this.initInputs();
    this.initUI();
    this.lastTime = performance.now();

    // Inicia na tela inicial
    audio.startMusic('menu');
    requestAnimationFrame((t) => this.loop(t));
  }

  initInputs() {
    window.addEventListener("keydown", (e) => {
      this.keys[e.key.toLowerCase()] = true;
      if (e.key === "Escape") this.togglePause();
    });
    window.addEventListener("keyup", (e) => {
      this.keys[e.key.toLowerCase()] = false;
    });

    this.canvas.addEventListener("mousedown", (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      this.mouse.x = (e.clientX - rect.left) * scaleX;
      this.mouse.y = (e.clientY - rect.top) * scaleY;
      this.mouse.clicked = true;
      this.handleCanvasClick();
    });

    // Touch Support
    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouch) {
      document.getElementById("touch-controls").style.display = "flex";
      this.bindTouchBtn("btn-left", "a");
      this.bindTouchBtn("btn-right", "d");
      this.bindTouchBtn("btn-jump", " ");
      this.bindTouchBtn("btn-attack", "attack");
    }
  }

  bindTouchBtn(id, keyName) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (keyName === "attack") {
        this.triggerPlayerAttack();
      } else {
        this.keys[keyName] = true;
      }
    });
    el.addEventListener("touchend", (e) => {
      e.preventDefault();
      if (keyName !== "attack") {
        this.keys[keyName] = false;
      }
    });
  }

  initUI() {
    document.getElementById("resume-btn").onclick = () => this.togglePause();
    document.getElementById("quit-map-btn").onclick = () => {
      this.togglePause();
      this.openWorldMap();
    };
    document.getElementById("toggle-music-btn").onclick = (e) => {
      audio.musicEnabled = !audio.musicEnabled;
      e.target.innerText = `MÚSICA: ${audio.musicEnabled ? 'LIGADA' : 'DESLIGADA'}`;
      if (!audio.musicEnabled) audio.stopMusic();
      else audio.startMusic(this.state === 'LEVEL' ? 'level1' : 'menu');
    };
    document.getElementById("toggle-sfx-btn").onclick = (e) => {
      audio.sfxEnabled = !audio.sfxEnabled;
      e.target.innerText = `EFEITOS: ${audio.sfxEnabled ? 'LIGADOS' : 'DESLIGADOS'}`;
    };
  }

  showToast(message) {
    const toast = document.getElementById("heart-toast");
    toast.innerText = message;
    toast.classList.add("show");
    audio.sfxHeart();
    setTimeout(() => {
      toast.classList.remove("show");
    }, 2800);
  }

  togglePause() {
    if (this.state !== "LEVEL") return;
    this.isPaused = !this.isPaused;
    document.getElementById("pause-modal").style.display = this.isPaused ? "flex" : "none";
  }

  handleCanvasClick() {
    audio.init();

    if (this.state === "TITLE") {
      // Botão JOGAR
      if (this.isInside(this.mouse.x, this.mouse.y, 380, 270, 200, 50)) {
        audio.sfxCoin();
        this.openWorldMap();
      }
      // Botão NOVO JOGO / REINICIAR
      if (this.isInside(this.mouse.x, this.mouse.y, 380, 340, 200, 45)) {
        audio.sfxJump();
        this.saveData = StorageSystem.getInitial();
        StorageSystem.save(this.saveData);
        this.openWorldMap();
      }
      // Botão CRÉDITOS
      if (this.isInside(this.mouse.x, this.mouse.y, 380, 405, 200, 45)) {
        audio.sfxCoin();
        alert("🎮 DILMA QUEST: A JORNADA LENDÁRIA\n\nHomenagem carinhosa e exclusiva criada pela TURMA DO 6º B para a querida Professora Dilma!\n\nObrigado por nos inspirar todos os dias!");
      }
    } else if (this.state === "WORLD_MAP") {
      this.handleWorldMapClick();
    } else if (this.state === "LEVEL") {
      this.triggerPlayerAttack();
    } else if (this.state === "VICTORY" || this.state === "GAMEOVER") {
      if (this.isInside(this.mouse.x, this.mouse.y, 380, 460, 200, 45)) {
        this.openWorldMap();
      }
    }
  }

  isInside(px, py, rx, ry, rw, rh) {
    return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
  }

  triggerPlayerAttack() {
    if (this.state !== "LEVEL" || this.isPaused) return;
    audio.sfxAttack();
    this.projectiles.push({
      x: this.player.x + (this.player.facing > 0 ? 20 : -20),
      y: this.player.y + 10,
      vx: this.player.facing * 9,
      radius: 8,
      life: 60
    });
  }

  // --- NAVEGAÇÃO ENTRE TELAS ---
  openWorldMap() {
    this.state = "WORLD_MAP";
    audio.startMusic('world');
  }

  startLevel(levelNumber) {
    this.state = "LEVEL";
    this.currentLevelIdx = levelNumber;
    const worldIndex = Math.floor((levelNumber - 1) / 4);
    this.currentWorldIdx = worldIndex;

    const wData = WORLDS[worldIndex];
    const lData = wData.levels[(levelNumber - 1) % 4];
    this.currentLevelData = lData;

    // Reseta estado do jogador
    this.player.x = 100;
    this.player.y = 300;
    this.player.vx = 0;
    this.player.vy = 0;
    this.player.lives = 3;
    this.cameraX = 0;
    this.projectiles = [];
    this.particles = [];

    // Carrega entidades da fase
    this.buildLevelEntities(lData);

    const trackName = lData.isBoss ? 'boss' : `level${worldIndex + 1}`;
    audio.startMusic(trackName);
  }

  buildLevelEntities(lData) {
    this.enemies = [];
    this.coins = [];
    this.hearts = [];
    this.quizTriggers = [];

    const isBoss = !!lData.isBoss;
    const length = lData.length;

    if (isBoss) {
      this.boss.active = true;
      this.boss.x = 2100;
      this.boss.y = 280;
      this.boss.hp = 12;
      this.boss.maxHp = 12;
      this.boss.state = 'idle';
      this.boss.timer = 0;
    } else {
      this.boss.active = false;
      const typeList = ['slime', 'cactus', 'golem', 'guard'];
      const enemyType = typeList[this.currentWorldIdx];

      // Gera plataformas e inimigos acessíveis e divertidos
      for (let x = 400; x < length - 400; x += 320) {
        this.enemies.push({
          x: x,
          y: 400,
          startX: x - 60,
          endX: x + 60,
          vx: 1.2,
          type: enemyType,
          alive: true
        });

        // Moedas
        this.coins.push({ x: x, y: 320, collected: false });
        this.coins.push({ x: x + 30, y: 320, collected: false });
      }

      // Corações afetivos pelo caminho
      this.hearts.push({ x: 750, y: 300, collected: false });
      this.hearts.push({ x: 1800, y: 280, collected: false });

      // Quiz educativo na metade da fase
      this.quizTriggers.push({
        x: 1200,
        y: 380,
        triggered: false
      });
    }
  }

  openQuiz(callback) {
    const q = quizBank.getRandom();
    const modal = document.getElementById("quiz-modal");
    const qCategory = document.getElementById("quiz-category");
    const qText = document.getElementById("quiz-question");
    const optBox = document.getElementById("quiz-options");
    const feedback = document.getElementById("quiz-feedback");
    const contBtn = document.getElementById("quiz-continue-btn");

    qCategory.innerText = `${q.category} • Nível: ${q.diff}`;
    qText.innerText = q.q;
    optBox.innerHTML = "";
    feedback.style.display = "none";
    contBtn.style.display = "none";
    modal.style.display = "flex";

    // Embaralha opções
    const shuffled = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correct }));
    shuffled.sort(() => Math.random() - 0.5);

    shuffled.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt-btn";
      btn.innerText = opt.text;
      btn.onclick = () => {
        // Desabilita botões
        const allBtns = optBox.querySelectorAll("button");
        allBtns.forEach(b => b.disabled = true);

        feedback.style.display = "block";
        contBtn.style.display = "inline-block";

        if (opt.isCorrect) {
          audio.sfxCorrect();
          feedback.className = "quiz-feedback correct";
          feedback.innerHTML = `<strong>✨ Resposta Correta!</strong><br>${q.exp}`;
          this.saveData.score += 250;
          this.saveData.coins += 5;
        } else {
          audio.sfxWrong();
          feedback.className = "quiz-feedback wrong";
          feedback.innerHTML = `<strong>💡 Muito bem por tentar!</strong> A resposta certa é: ${q.options[q.correct]}.<br>${q.exp}`;
          this.saveData.score += 50;
        }
      };
      optBox.appendChild(btn);
    });

    contBtn.onclick = () => {
      modal.style.display = "none";
      if (callback) callback();
    };
  }

  // --- 8. LOOP PRINCIPAL DE FÍSICA E ATUALIZAÇÃO ---
  update(dt) {
    if (this.isPaused) return;

    if (this.state === "LEVEL") {
      this.updateLevel(dt);
    }
  }

  updateLevel(dt) {
    const p = this.player;
    p.animFrame++;

    // Movimentação Horizontal
    const moveLeft = this.keys['a'] || this.keys['arrowleft'];
    const moveRight = this.keys['d'] || this.keys['arrowright'];

    if (moveLeft) {
      p.vx = -4.5;
      p.facing = -1;
      p.state = 'walk';
    } else if (moveRight) {
      p.vx = 4.5;
      p.facing = 1;
      p.state = 'walk';
    } else {
      p.vx *= 0.7;
      if (Math.abs(p.vx) < 0.1) p.vx = 0;
      p.state = 'idle';
    }

    // Pulo macio e acessível (Coyote time)
    if (p.grounded) {
      p.coyoteTimer = 8;
    } else if (p.coyoteTimer > 0) {
      p.coyoteTimer--;
    }

    const wantsJump = this.keys[' '] || this.keys['w'] || this.keys['arrowup'];
    if (wantsJump && p.coyoteTimer > 0) {
      p.vy = -12.5; // Pulo generoso
      p.grounded = false;
      p.coyoteTimer = 0;
      audio.sfxJump();
    }

    // Gravidade amigável
    p.vy += 0.58;
    if (p.vy > 12) p.vy = 12;

    p.x += p.vx;
    p.y += p.vy;

    // Chão padrão da fase
    const groundLevel = 420;
    if (p.y >= groundLevel) {
      p.y = groundLevel;
      p.vy = 0;
      p.grounded = true;
    } else {
      p.grounded = false;
    }

    // Limites da fase
    if (p.x < 20) p.x = 20;

    // Câmera dinâmica centralizada
    this.cameraX = p.x - 300;
    if (this.cameraX < 0) this.cameraX = 0;
    const maxCam = this.currentLevelData.length - 960;
    if (this.cameraX > maxCam) this.cameraX = maxCam;

    // Imunidade após dano
    if (p.invulnerable > 0) p.invulnerable--;

    // Projéteis do Saber
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const pr = this.projectiles[i];
      pr.x += pr.vx;
      pr.life--;
      if (pr.life <= 0) {
        this.projectiles.splice(i, 1);
        continue;
      }

      // Colisão Projétil x Inimigos
      for (const en of this.enemies) {
        if (en.alive && Math.hypot(pr.x - en.x, pr.y - en.y) < 26) {
          en.alive = false;
          pr.life = 0;
          audio.sfxHit();
          this.saveData.score += 100;
          this.createSparkles(en.x, en.y, "#ffca28");
        }
      }

      // Colisão Projétil x Boss
      if (this.boss.active && Math.hypot(pr.x - this.boss.x, pr.y - (this.boss.y + 20)) < 65) {
        pr.life = 0;
        this.boss.hp--;
        this.boss.state = 'hit';
        this.boss.hitTimer = 15;
        audio.sfxHit();
        this.createSparkles(pr.x, pr.y, "#9c27b0");

        if (this.boss.hp <= 0) {
          this.triggerVictory();
        }
      }
    }

    // Inimigos
    for (const en of this.enemies) {
      if (!en.alive) continue;
      en.x += en.vx;
      if (en.x > en.endX || en.x < en.startX) {
        en.vx *= -1;
      }

      // Colisão Inimigo x Jogador (Fácil: apenas perde vida se não estiver invulnerável)
      if (Math.hypot(p.x - en.x, p.y - en.y) < 28 && p.invulnerable <= 0) {
        // Pulo na cabeça elimina o inimigo
        if (p.vy > 0 && p.y < en.y - 10) {
          en.alive = false;
          p.vy = -9; // Pequeno pulinho recompensador
          audio.sfxHit();
          this.saveData.score += 150;
        } else {
          p.lives--;
          p.invulnerable = 60;
          audio.sfxHit();
          if (p.lives <= 0) {
            // Checkpoint gentil: não faz perder o progresso todo
            p.lives = 3;
            p.x = Math.max(100, p.x - 300);
            p.y = 350;
            this.showToast("💖 Não desista, Professora! Estamos juntos!");
          }
        }
      }
    }

    // Coleta de Moedas
    for (const c of this.coins) {
      if (!c.collected && Math.hypot(p.x - c.x, p.y - c.y) < 26) {
        c.collected = true;
        this.saveData.coins++;
        this.saveData.score += 50;
        audio.sfxCoin();
        this.createSparkles(c.x, c.y, "#ffd700");
      }
    }

    // Coleta de Corações Especiais
    for (const h of this.hearts) {
      if (!h.collected && Math.hypot(p.x - h.x, p.y - h.y) < 28) {
        h.collected = true;
        this.saveData.heartsCollected++;
        this.saveData.score += 300;
        const msg = TRIBUTE_MESSAGES[Math.floor(Math.random() * TRIBUTE_MESSAGES.length)];
        this.showToast(msg);
        this.createSparkles(h.x, h.y, "#ff4081");
      }
    }

    // Trigger de Quiz
    for (const q of this.quizTriggers) {
      if (!q.triggered && Math.abs(p.x - q.x) < 30) {
        q.triggered = true;
        this.openQuiz();
      }
    }

    // Atualização do Chefão Final
    if (this.boss.active) {
      this.boss.timer++;
      if (this.boss.hitTimer > 0) {
        this.boss.hitTimer--;
        if (this.boss.hitTimer === 0) this.boss.state = 'idle';
      }

      // Movimentação suave e previsível do Chefão para não ser frustrante
      this.boss.y = 260 + Math.sin(this.boss.timer * 0.04) * 35;

      // Ataque de sombras bem sinalizado a cada 200 frames
      if (this.boss.timer % 180 === 0) {
        // Dispara uma esfera mágica lenta em direção ao jogador
        this.createSparkles(this.boss.x - 50, this.boss.y, "#d500f9");
      }
    }

    // Chegada ao final da fase comum
    if (!this.currentLevelData.isBoss && p.x >= this.currentLevelData.length - 120) {
      this.completeCurrentLevel();
    }
  }

  createSparkles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        color,
        life: 25
      });
    }
  }

  completeCurrentLevel() {
    audio.sfxCorrect();
    if (!this.saveData.completedLevels.includes(this.currentLevelIdx)) {
      this.saveData.completedLevels.push(this.currentLevelIdx);
    }
    if (this.saveData.unlockedLevel <= this.currentLevelIdx) {
      this.saveData.unlockedLevel = this.currentLevelIdx + 1;
    }
    StorageSystem.save(this.saveData);
    this.openWorldMap();
  }

  triggerVictory() {
    this.state = "VICTORY";
    audio.startMusic('victory');
    if (!this.saveData.completedLevels.includes(16)) {
      this.saveData.completedLevels.push(16);
    }
    StorageSystem.save(this.saveData);
  }

  // --- 9. RENDERIZAÇÃO GRÁFICA ---
  render() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    if (this.state === "TITLE") {
      this.renderTitleScreen();
    } else if (this.state === "WORLD_MAP") {
      this.renderWorldMap();
    } else if (this.state === "LEVEL") {
      this.renderLevel();
    } else if (this.state === "VICTORY") {
      this.renderVictoryScreen();
    }
  }

  renderTitleScreen() {
    const ctx = this.ctx;
    // Gradiente de Fundo
    const grad = ctx.createLinearGradient(0, 0, 0, 540);
    grad.addColorStop(0, "#1a237e");
    grad.addColorStop(0.6, "#311b92");
    grad.addColorStop(1, "#0d47a1");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 540);

    // Estrelas cintilantes de fundo
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 40; i++) {
      const sx = (i * 73 + performance.now() * 0.02) % 960;
      const sy = (i * 47) % 360;
      ctx.fillRect(sx, sy, 2, 2);
    }

    // Logo Principal
    ctx.textAlign = "center";
    ctx.font = "38px 'Press Start 2P', monospace";
    ctx.fillStyle = "#ffca28";
    ctx.shadowColor = "#000";
    ctx.shadowOffsetX = 4;
    ctx.shadowOffsetY = 4;
    ctx.fillText("DILMA QUEST", 480, 130);

    ctx.font = "16px 'Press Start 2P', monospace";
    ctx.fillStyle = "#80d8ff";
    ctx.fillText("★ A JORNADA LENDÁRIA ★", 480, 175);

    ctx.font = "14px 'Fredoka', sans-serif";
    ctx.fillStyle = "#ffd54f";
    ctx.fillText("Uma homenagem com muito carinho da Turma do 6º B", 480, 215);

    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Desenho da Professora Dilma em destaque na tela inicial
    PixelArtist.drawDilma(ctx, 480, 230, 1, performance.now() * 0.01, 'idle');

    // Botões do Menu
    this.drawMenuButton(380, 270, 200, 50, "JOGAR", "#4caf50");
    this.drawMenuButton(380, 340, 200, 45, "RECOMEÇAR", "#ff9800");
    this.drawMenuButton(380, 405, 200, 45, "CRÉDITOS", "#0288d1");
  }

  drawMenuButton(x, y, w, h, text, bg) {
    const ctx = this.ctx;
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "14px 'Press Start 2P', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + w / 2, y + h / 2);
  }

  renderWorldMap() {
    const ctx = this.ctx;
    ctx.fillStyle = "#1e3a1e";
    ctx.fillRect(0, 0, 960, 540);

    // Título do Mapa
    ctx.fillStyle = "#ffd700";
    ctx.font = "18px 'Press Start 2P', monospace";
    ctx.textAlign = "center";
    ctx.fillText("MAPA MUNDIAL — ESCOLHA A FASE", 480, 45);

    // Trilhas entre as 16 fases
    ctx.strokeStyle = "#8d6e63";
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const pos = this.getLevelNodePos(i + 1);
      if (i === 0) ctx.moveTo(pos.x, pos.y);
      else ctx.lineTo(pos.x, pos.y);
    }
    ctx.stroke();

    // Nós de cada fase
    for (let i = 1; i <= 16; i++) {
      const pos = this.getLevelNodePos(i);
      const isUnlocked = i <= this.saveData.unlockedLevel;
      const isCompleted = this.saveData.completedLevels.includes(i);
      const isBoss = i === 16;

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, isBoss ? 24 : 18, 0, Math.PI * 2);

      if (isCompleted) {
        ctx.fillStyle = "#4caf50"; // Verde = Concluída
      } else if (isUnlocked) {
        ctx.fillStyle = isBoss ? "#e91e63" : "#ffca28"; // Dourado / Rosa = Disponível
      } else {
        ctx.fillStyle = "#546e7a"; // Cinza = Bloqueada
      }
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Número da fase
      ctx.fillStyle = isUnlocked ? "#000" : "#b0bec5";
      ctx.font = "12px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(isBoss ? "👑" : i.toString(), pos.x, pos.y);
    }

    // Legenda Inferior & Estatísticas
    ctx.fillStyle = "#fff";
    ctx.font = "14px 'Fredoka', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`⭐ Pontuação: ${this.saveData.score}  |  🪙 Moedas: ${this.saveData.coins}  |  💖 Corações: ${this.saveData.heartsCollected}`, 480, 505);
  }

  getLevelNodePos(num) {
    // Organiza as 16 fases em uma trilha serpenteante pelos 4 mundos
    const row = Math.floor((num - 1) / 4);
    const col = (num - 1) % 4;
    const x = (row % 2 === 0) ? (160 + col * 210) : (790 - col * 210);
    const y = 110 + row * 95;
    return { x, y };
  }

  handleWorldMapClick() {
    for (let i = 1; i <= 16; i++) {
      const pos = this.getLevelNodePos(i);
      if (Math.hypot(this.mouse.x - pos.x, this.mouse.y - pos.y) < 24) {
        if (i <= this.saveData.unlockedLevel) {
          audio.sfxCoin();
          this.startLevel(i);
        } else {
          audio.sfxWrong();
        }
        break;
      }
    }
  }

  renderLevel() {
    const ctx = this.ctx;
    const wData = WORLDS[this.currentWorldIdx];

    // Céu e Fundo
    ctx.fillStyle = wData.skyColor;
    ctx.fillRect(0, 0, 960, 540);

    // Montanhas / Vegetação ao fundo (Parallax simples)
    ctx.fillStyle = wData.color;
    for (let i = 0; i < 15; i++) {
      const bgX = (i * 240) - (this.cameraX * 0.3) % 240;
      ctx.beginPath();
      ctx.moveTo(bgX, 420);
      ctx.lineTo(bgX + 120, 240);
      ctx.lineTo(bgX + 240, 420);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(-Math.round(this.cameraX), 0);

    // Chão Principal
    ctx.fillStyle = "#3e2723";
    ctx.fillRect(0, 420, this.currentLevelData.length, 120);
    // Grama / Superfície
    ctx.fillStyle = wData.color;
    ctx.fillRect(0, 420, this.currentLevelData.length, 18);

    // Portão Final da Fase (ou Castelo)
    const endX = this.currentLevelData.length - 120;
    ctx.fillStyle = "#ffca28";
    ctx.fillRect(endX, 330, 40, 90);
    ctx.fillStyle = "#b71c1c";
    ctx.beginPath();
    ctx.moveTo(endX - 10, 330);
    ctx.lineTo(endX + 20, 290);
    ctx.lineTo(endX + 50, 330);
    ctx.fill();

    // Coletáveis (Moedas e Corações)
    for (const c of this.coins) {
      if (!c.collected) PixelArtist.drawCoin(ctx, c.x, c.y, this.player.animFrame);
    }
    for (const h of this.hearts) {
      if (!h.collected) PixelArtist.drawHeart(ctx, h.x, h.y, 1.2 + Math.sin(this.player.animFrame * 0.1) * 0.15);
    }

    // Altar do Quiz (Ponto de Conhecimento)
    for (const q of this.quizTriggers) {
      if (!q.triggered) {
        ctx.fillStyle = "#3f51b5";
        ctx.fillRect(q.x - 12, q.y - 24, 24, 44);
        ctx.fillStyle = "#ffd54f";
        ctx.font = "16px 'Press Start 2P', monospace";
        ctx.fillText("?", q.x - 6, q.y - 4);
      }
    }

    // Inimigos
    for (const en of this.enemies) {
      if (en.alive) PixelArtist.drawEnemy(ctx, en.x, en.y, en.type, this.player.animFrame);
    }

    // Chefão Final
    if (this.boss.active) {
      PixelArtist.drawBoss(ctx, this.boss.x, this.boss.y, this.boss.hp, this.boss.maxHp, this.player.animFrame, this.boss.state);
    }

    // Projéteis do Saber
    for (const pr of this.projectiles) {
      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, pr.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Partículas
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life--;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, 4, 4);
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // Desenha a Heroína: Professora Dilma
    if (this.player.invulnerable % 4 < 2) {
      PixelArtist.drawDilma(
        ctx,
        this.player.x,
        this.player.y,
        this.player.facing,
        this.player.animFrame,
        this.player.state
      );
    }

    ctx.restore();

    // HUD Superior
    this.renderHUD();
  }

  renderHUD() {
    const ctx = this.ctx;
    ctx.fillStyle = "rgba(10, 14, 28, 0.75)";
    ctx.fillRect(0, 0, 960, 52);

    ctx.font = "12px 'Press Start 2P', monospace";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText(`FASE ${this.currentLevelIdx}: ${this.currentLevelData.name}`, 20, 32);

    // Vidas
    ctx.fillStyle = "#ff1744";
    let heartsText = "";
    for (let i = 0; i < this.player.lives; i++) heartsText += "♥ ";
    ctx.fillText(heartsText, 490, 32);

    // Moedas & Pontos
    ctx.fillStyle = "#ffd700";
    ctx.textAlign = "right";
    ctx.fillText(`🪙 ${this.saveData.coins}   ⭐ ${this.saveData.score}`, 940, 32);

    // Barra de Vida do Chefão Final
    if (this.boss.active) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(280, 64, 400, 20);
      const hpWidth = Math.max(0, (this.boss.hp / this.boss.maxHp) * 396);
      ctx.fillStyle = "#d50000";
      ctx.fillRect(282, 66, hpWidth, 16);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.strokeRect(280, 64, 400, 20);

      ctx.fillStyle = "#fff";
      ctx.font = "10px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillText("DEVORADOR DAS SOMBRAS", 480, 78);
    }
  }

  renderVictoryScreen() {
    const ctx = this.ctx;
    ctx.fillStyle = "#0d1b2a";
    ctx.fillRect(0, 0, 960, 540);

    // Fogos e Brilhos
    for (let i = 0; i < 20; i++) {
      const fx = (i * 97 + performance.now() * 0.05) % 960;
      const fy = (i * 61) % 240;
      PixelArtist.drawHeart(ctx, fx, fy, 0.9);
    }

    ctx.textAlign = "center";
    ctx.font = "24px 'Press Start 2P', monospace";
    ctx.fillStyle = "#ffd700";
    ctx.fillText("VITÓRIA LENDÁRIA!", 480, 80);

    // Texto de Homenagem Oficial
    ctx.font = "18px 'Fredoka', sans-serif";
    ctx.fillStyle = "#ffffff";
    const tributeLines = [
      "\"Professora Dilma, a gente nunca vai esquecer de você.",
      "Cada aula, cada ensinamento e cada momento fizeram parte dessa jornada.",
      "Essa aventura foi criada com muito carinho para homenagear você.\"",
      "",
      "Com todo carinho e amor,",
      "TURMA DO 6º B"
    ];

    tributeLines.forEach((line, index) => {
      if (line === "TURMA DO 6º B") {
        ctx.font = "22px 'Press Start 2P', monospace";
        ctx.fillStyle = "#ff4081";
      } else {
        ctx.font = "17px 'Fredoka', sans-serif";
        ctx.fillStyle = "#e0f7fa";
      }
      ctx.fillText(line, 480, 150 + index * 34);
    });

    PixelArtist.drawDilma(ctx, 480, 380, 1, performance.now() * 0.01, 'idle');
    this.drawMenuButton(380, 460, 200, 45, "MAPA MUNDIAL", "#4caf50");
  }

  loop(currentTime) {
    const dt = (currentTime - this.lastTime) / 1000;
    this.lastTime = currentTime;

    this.update(dt);
    this.render();

    requestAnimationFrame((t) => this.loop(t));
  }
}

// Inicia o jogo assim que a página é carregada
window.addEventListener("DOMContentLoaded", () => {
  window.gameInstance = new Game();
});
</script>
